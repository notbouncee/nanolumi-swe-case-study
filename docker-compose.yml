version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-water_quality}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    depends_on:
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-water_quality}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  simulator:
    image: water-quality-simulator:1.0.0
    ports:
      - "${SIMULATOR_PORT:-9000}:9000"
    environment:
      PORT: "9000"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - simulator-data:/data
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-water_quality}
      SIMULATOR_URL: http://simulator:9000
    depends_on:
      db:
        condition: service_healthy
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  simulator-data:
  postgres-data:
