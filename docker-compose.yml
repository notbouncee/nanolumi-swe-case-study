version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-water_quality}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  simulator:
    image: water-quality-simulator:1.0.0
    ports:
      - "${SIMULATOR_PORT:-9000}:9000"
    environment:
      PORT: "9000"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - simulator-data:/data
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-water_quality}
      SIMULATOR_URL: http://simulator:9000
    depends_on:
      - db
      - simulator
    volumes:
      - ./backend:/app
    restart: unless-stopped

volumes:
  simulator-data:
  postgres-data:
