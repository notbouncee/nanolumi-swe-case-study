[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanolumi_backend"
version = "0.1.0"
description = "Water Quality Dashboard Backend"
dependencies = [
    "fastapi[all]==0.111.0",
    "uvicorn==0.30.1",
    "tortoise-orm==0.21.4",
    "asyncpg==0.29.0",
    "httpx==0.27.0",
    "pydantic==2.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "greenlet==3.0.3",
    "pytest-mock==3.14.0",
    "respx==0.21.1",
    "black==24.4.2",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
]

[tool.pyright]
extraPaths = ["."]
executionEnvironments = [
  { root = "." }
]
